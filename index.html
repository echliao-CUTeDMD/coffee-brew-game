<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>手沖咖啡模擬器</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
:root{--bg:#e9eeee;--panel:#f7f9f8;--ink:#1d2a2c;--mute:#5d6e70;--line:#c4d0d0;--accent:#2f6f86;--accent-ink:#fff;--coffee:#6b3f1d;--good:#2e7d4f;--bad:#b3452e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b1c;--panel:#1d2829;--ink:#e6eeee;--mute:#92a5a7;--line:#33454a;--accent:#6fb3cc;--accent-ink:#0e1a1d;--good:#6fcf98;--bad:#ef8a72}}
:root[data-theme="dark"]{--bg:#141b1c;--panel:#1d2829;--ink:#e6eeee;--mute:#92a5a7;--line:#33454a;--accent:#6fb3cc;--accent-ink:#0e1a1d;--good:#6fcf98;--bad:#ef8a72}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;line-height:1.6}
h1,h2{font-family:"Noto Serif TC",serif;margin:0}
header{padding:20px 20px 0;max-width:900px;margin:0 auto}
h1{font-size:clamp(26px,5vw,38px);font-weight:900;letter-spacing:.02em}
header p{margin:4px 0 0;color:var(--mute)}
main{max-width:900px;margin:0 auto;padding:16px 20px 32px;display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:20px}
@media(max-width:720px){main{grid-template-columns:1fr}}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px;position:relative}
canvas{width:100%;max-width:380px;aspect-ratio:360/440;display:block;margin:0 auto;touch-action:none;cursor:crosshair}
.views{display:flex;gap:6px;padding:0 4px 8px}.views button{flex:1;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:inherit;padding:7px;border-radius:10px;cursor:pointer}.views button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);font-weight:700}
.hud{display:flex;justify-content:space-between;gap:8px;padding:6px 8px 2px;font-variant-numeric:tabular-nums;font-size:14px;color:var(--mute)}
.hud b{color:var(--ink);font-size:17px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}
h2{font-size:22px;margin-bottom:12px}
.beans{display:grid;gap:8px;margin-bottom:16px}
.bean{text-align:left;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:12px;padding:10px 14px;font:inherit;cursor:pointer}
.bean small{display:block;color:var(--mute)}
.bean[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
label{display:flex;justify-content:space-between;font-weight:500;margin-top:12px}
label span{color:var(--accent);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.scale{display:flex;justify-content:space-between;color:var(--mute);font-size:13px}
button.go{margin-top:20px;width:100%;border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;font-size:17px;padding:13px;border-radius:12px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.steps{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.steps li{padding:10px 14px;border-radius:10px;border:1px solid var(--line);color:var(--mute)}
.steps li.on{border-color:var(--accent);color:var(--ink);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.steps li.done{opacity:.55;text-decoration:line-through}
.tip{margin-top:14px;color:var(--mute);font-size:14px}
.score{font-family:"Noto Serif TC",serif;font-size:64px;font-weight:900;line-height:1;color:var(--accent)}
.rank{font-size:20px;font-weight:700;margin:4px 0 14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.stats div{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;color:var(--mute)}
.stats b{display:block;font-size:18px;color:var(--ink)}
.stats .ok b{color:var(--good)}.stats .no b{color:var(--bad)}
.note{margin:6px 0}
[hidden]{display:none!important}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);cursor:pointer}
#advBox{border-top:1px dashed var(--line);margin-top:12px;padding-top:2px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<header>
<h1>手沖咖啡模擬器</h1>
<p>選豆、調參數,再親手注水。萃取率落在 18–22% 就是好咖啡。</p>
</header>
<main>
<section class="stage">
<div class="views"><button type="button" data-v="side" aria-pressed="true">側面剖視</button><button type="button" data-v="top" aria-pressed="false">正視角(俯視濾杯)</button></div>
<canvas id="c" width="360" height="440" aria-label="手沖咖啡操作區"></canvas>
<div class="hud"><div>時間 <b id="hT">0:00</b></div><div>注水 <b id="hP">0</b> g</div><div>穩定度 <b id="hS">--</b></div></div>
</section>

<section class="panel" id="setup">
<h2>準備這一杯</h2>
<div class="beans" id="beans"></div>
<label>研磨度 <span id="gv"></span></label>
<input type="range" id="grind" min="1" max="10" step="1" value="5" aria-label="研磨度">
<div class="scale"><span>細</span><span>粗</span></div>
<label>水溫 <span id="tv"></span></label>
<input type="range" id="temp" min="80" max="100" step="1" value="92" aria-label="水溫">
<div class="scale"><span>80°C</span><span>100°C</span></div>
<label style="align-items:center;margin-top:16px"><span style="color:var(--ink)">進階模式:自訂粉量、水量與悶蒸</span><input type="checkbox" id="adv"></label>
<div id="advBox" hidden>
<label>粉量 <span id="dv"></span></label><input type="range" id="dose" min="10" max="25" step="1" value="15" aria-label="粉量">
<label>總注水量 <span id="wv"></span></label><input type="range" id="water" min="150" max="400" step="10" value="240" aria-label="總注水量">
<label>悶蒸水量 <span id="bv"></span></label><input type="range" id="bwater" min="20" max="80" step="5" value="40" aria-label="悶蒸水量">
<label>悶蒸時間 <span id="btv"></span></label><input type="range" id="btime" min="15" max="60" step="5" value="30" aria-label="悶蒸時間">
<label>注水速度 <span id="rv"></span></label><input type="range" id="prate" min="3" max="10" step="1" value="6" aria-label="注水速度">
<p class="tip" id="est"></p>
</div>
<p class="tip" id="basicTip">基本模式:粉量 15g,目標注水 240g。研磨越細,水流越慢,萃取越多。</p>
<button class="go" id="start">開始沖煮</button>
</section>

<section class="panel" id="brew" hidden>
<h2>沖煮中</h2>
<ol class="steps" id="steps">
<li>悶蒸:按住畫面注水約 40g</li>
<li>等待悶蒸 30 秒</li>
<li>按住畫面繞圈注水到 240g</li>
<li>等待咖啡滴完</li>
</ol>
<p class="tip">按住畫面開始注水,讓水柱跟著水圈移動。偏離水圈會讓粉層受水不均,風味變差。水位滿到杯緣時要先停手。</p>
<button class="go" id="reset" style="background:transparent;color:var(--ink);border:1.5px solid var(--line)">放棄,重新設定</button>
</section>

<section class="panel" id="result" hidden>
<h2>試飲結果</h2>
<div class="score" id="rs">0</div>
<div class="rank" id="rr"></div>
<div class="stats" id="rstats"></div>
<div id="rnotes"></div>
<p class="tip" id="recipe"></p>
<p class="tip" id="best"></p>
<button class="go" id="again">再沖一杯</button>
</section>
</main>

<script>
(function(){
var BEANS=[
 {n:"淺焙・衣索比亞",d:"花香、柑橘酸,不易萃取,建議水溫 94°C",sol:.92},
 {n:"中焙・哥倫比亞",d:"焦糖、堅果,最好上手,建議水溫 92°C",sol:1},
 {n:"深焙・曼特寧",d:"可可、草本,容易過萃,建議水溫 88°C",sol:1.08}];
var $=function(i){return document.getElementById(i)};
var cv=$("c"),ctx=cv.getContext("2d"),dpr=Math.min(window.devicePixelRatio||1,2);
cv.width=360*dpr;cv.height=440*dpr;ctx.scale(dpr,dpr);
var S={view:"side",phase:"setup",bean:1,W:0,poured:0,out:0,t:0,started:false,bloomT:0,onT:0,pourT:0,ang:0,px:180,py:150,down:false,best:0};
var GN=["最細","很細","偏細","中細","中等","中粗","偏粗","粗","很粗","最粗"];
var CAP=200,RET=25;

// setup UI
var bw=$("beans");
BEANS.forEach(function(b,i){
 var el=document.createElement("button");el.className="bean";el.type="button";
 el.innerHTML=b.n+"<small>"+b.d+"</small>";
 el.onclick=function(){S.bean=i;sync()};bw.appendChild(el);
});
function sync(){
 [].forEach.call(bw.children,function(el,i){el.setAttribute("aria-pressed",i===S.bean)});
 $("gv").textContent=GN[$("grind").value-1];
 $("tv").textContent=$("temp").value+"°C";
 var P=params();
 $("dv").textContent=$("dose").value+" g";$("wv").textContent=$("water").value+" g";$("bv").textContent=$("bwater").value+" g";$("btv").textContent=$("btime").value+" 秒";$("rv").textContent=$("prate").value+" g/秒";
 $("advBox").hidden=!$("adv").checked;$("basicTip").hidden=$("adv").checked;
 $("est").textContent="粉水比 1:"+(P.water/P.dose).toFixed(1)+"(常見 1:15–1:17)。悶蒸水量是粉量的 "+(P.bloomW/P.dose).toFixed(1)+" 倍(建議 2–3 倍)。濾杯一次約裝 "+CAP+"g 水,注水太快或磨太細都容易滿出來。";
}
["grind","temp","dose","water","bwater","btime","prate","adv"].forEach(function(i){$(i).oninput=sync;$(i).onchange=sync});sync();

function show(id){["setup","brew","result"].forEach(function(x){$(x).hidden=x!==id})}
function steps(n){[].forEach.call($("steps").children,function(li,i){li.className=i<n?"done":i===n?"on":""})}
function params(){var a=$("adv").checked;return a?{dose:+$("dose").value,water:+$("water").value,bloomW:+$("bwater").value,bloomT:+$("btime").value,rate:+$("prate").value}:{dose:15,water:240,bloomW:40,bloomT:30,rate:6}}
function begin(){
 S.P=params();RET=S.P.dose*1.7;
 var li=$("steps").children;li[0].textContent="悶蒸:按住畫面注水約 "+S.P.bloomW+"g";li[1].textContent="等待悶蒸 "+S.P.bloomT+" 秒";li[2].textContent="按住畫面繞圈注水到 "+S.P.water+"g";
 S.phase="pour1";S.W=0;S.poured=0;S.out=0;S.t=0;S.started=false;S.bloomT=0;S.onT=0;S.pourT=0;S.down=false;
 show("brew");steps(0);
}
$("start").onclick=begin;
$("again").onclick=function(){S.phase="setup";show("setup")};
$("reset").onclick=function(){S.phase="setup";show("setup")};

// pointer
function pos(e){var r=cv.getBoundingClientRect();S.px=(e.clientX-r.left)*360/r.width;S.py=(e.clientY-r.top)*440/r.height}
cv.addEventListener("pointerdown",function(e){pos(e);S.down=true;cv.setPointerCapture(e.pointerId)});
cv.addEventListener("pointermove",pos);
["pointerup","pointercancel"].forEach(function(n){cv.addEventListener(n,function(){S.down=false})});

function ring(){return S.view==="top"?{x:180+Math.cos(S.ang)*40,y:205+Math.sin(S.ang)*40}:{x:180+Math.cos(S.ang)*34,y:165+Math.sin(S.ang)*16}}
var last=performance.now();
function loop(now){
 var dt=Math.min(.05,(now-last)/1000);last=now;
 update(dt);draw(now);requestAnimationFrame(loop);
}
function update(dt){
 S.ang+=dt*1.5;
 var p=S.phase;if(p==="setup"||p==="done")return;
 var sim=dt*2.5,g=+$("grind").value;
 var pouring=false;
 if(S.down&&(p==="pour1"||p==="main")){
  var lim=p==="pour1"?S.P.bloomW:S.P.water;
  if(S.W<CAP+RET&&S.poured<lim){
   var a=Math.min(S.P.rate*sim,lim-S.poured,CAP+RET-S.W);
   S.W+=a;S.poured+=a;S.started=true;pouring=true;
   S.pourT+=sim;var r=ring();
   if(Math.hypot(S.px-r.x,S.py-r.y)<34)S.onT+=sim;
  }
 }
 S.pouring=pouring;
 if(S.started)S.t+=sim;
 if(p==="pour1"&&S.poured>=S.P.bloomW){S.phase="bloom";steps(1)}
 if(p==="bloom"){S.bloomT+=sim;if(S.bloomT>=S.P.bloomT){S.phase="main";steps(2)}}
 if(p==="main"&&S.poured>=S.P.water){S.phase="drain";steps(3)}
 var avail=Math.max(0,S.W-RET);
 var rate=(0.9+g*0.32)*Math.min(1,avail/25)*(S.phase==="bloom"?.25:1);
 var d=Math.min(avail,rate*sim);S.W-=d;S.out+=d;
 if(S.phase==="drain"&&S.W-RET<1.5)finish();
}
function finish(){
 S.phase="done";
 var g=+$("grind").value,temp=+$("temp").value,b=BEANS[S.bean];
 var stab=S.pourT>0?S.onT/S.pourT:0;
 var fine=(11-g)/10;
 var P=S.P,bwr=P.bloomW/P.dose;
 var ext=(14+fine*8+(temp-90)*.2+(S.t-120*P.water/240)/60*1.5-(1-stab)*3+(P.water/P.dose-16)*.25+(P.bloomT-30)/30*.6+(P.rate-6)*.15-Math.max(0,1.5-bwr)*2)*b.sol;
 ext=Math.max(10,Math.min(30,ext));
 var tds=ext/100*P.dose/S.out*100;
 var eS=50-Math.max(0,Math.abs(ext-20)-1)*10;
 var tS=30-Math.max(0,Math.abs(tds-1.3)-.15)*60;
 var score=Math.round(Math.max(0,eS)+Math.max(0,tS)+20*stab);
 score=Math.max(0,Math.min(100,score));
 var rk=score>=90?"大師級咖啡師":score>=75?"專業咖啡師":score>=55?"合格的新手":"再多練幾杯吧";
 var eOk=ext>=18&&ext<=22,tOk=tds>=1.15&&tds<=1.45;
 $("rs").textContent=score;$("rr").textContent=rk;
 var m=Math.floor(S.t/60),s=Math.round(S.t%60);
 $("rstats").innerHTML=
  '<div class="'+(eOk?"ok":"no")+'">萃取率<b>'+ext.toFixed(1)+'%</b></div>'+
  '<div class="'+(tOk?"ok":"no")+'">濃度 TDS<b>'+tds.toFixed(2)+'%</b></div>'+
  '<div>沖煮時間<b>'+m+':'+(s<10?"0":"")+s+'</b></div>'+
  '<div class="'+(stab>.7?"ok":"no")+'">注水穩定度<b>'+Math.round(stab*100)+'%</b></div>';
 var n=[];
 if(ext<18)n.push("風味偏酸、單薄,尾韻很短。下次試試磨細一點或提高水溫。");
 else if(ext>22)n.push("風味偏苦、澀口。下次試試磨粗一點或降低水溫。");
 else n.push("萃取均衡,甜感乾淨,尾韻明亮。");
 if(tds<1.15)n.push("口感偏淡,像加了水。");
 else if(tds>1.45)n.push("口感偏濃,厚重而壓口。");
 if(bwr<1.5)n.push("悶蒸水量太少,粉沒有完全浸濕,排氣不均,風味會偏酸。");
 if(stab<.6)n.push("注水不夠穩,粉層受水不均,有些地方萃取不足。");
 $("rnotes").innerHTML=n.map(function(x){return'<p class="note">'+x+'</p>'}).join("");
 S.best=Math.max(S.best,score);
 $("recipe").textContent="配方:"+b.n+"、研磨"+GN[g-1]+"、"+temp+"°C、粉 "+P.dose+"g、水 "+P.water+"g(1:"+(P.water/P.dose).toFixed(1)+")、悶蒸 "+P.bloomW+"g/"+P.bloomT+" 秒、注水 "+P.rate+" g/秒";
 $("best").textContent="本次最高分:"+S.best;
 show("result");
}

// drawing
function path(){
 ctx.beginPath();ctx.moveTo(60,140);ctx.lineTo(300,140);ctx.lineTo(214,310);ctx.lineTo(146,310);ctx.closePath();
}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function drawTop(now){
 ctx.clearRect(0,0,360,440);
 var ink=css("--ink"),line=css("--line"),acc=css("--accent"),cx=180,cy=205,p=S.phase;
 ctx.fillStyle=line;ctx.globalAlpha=.35;ctx.beginPath();ctx.arc(cx,cy,150,0,7);ctx.fill();ctx.globalAlpha=1;
 ctx.strokeStyle=ink;ctx.lineWidth=4;ctx.beginPath();ctx.arc(cx,cy,128,0,7);ctx.stroke();
 ctx.fillStyle="#3b2412";ctx.beginPath();ctx.arc(cx,cy,118,0,7);ctx.fill();
 if(S.W>1){var wr=118*Math.min(1,.3+S.W/90);var gr=ctx.createRadialGradient(cx,cy,5,cx,cy,wr);gr.addColorStop(0,"rgba(107,63,29,.95)");gr.addColorStop(1,"rgba(88,52,24,.8)");ctx.fillStyle=gr;ctx.beginPath();ctx.arc(cx,cy,wr,0,7);ctx.fill()}
 if(p==="bloom"){ctx.strokeStyle="rgba(210,170,120,.7)";ctx.lineWidth=1.5;for(var i=0;i<18;i++){var a=i*2.4,rr=15+(i*37)%85,bx=cx+Math.cos(a)*rr,by=cy+Math.sin(a)*rr;ctx.beginPath();ctx.arc(bx,by,2+(Math.sin(now/300+i)+1)*2.5,0,7);ctx.stroke()}}
 if(p==="pour1"||p==="main"){
  ctx.strokeStyle=acc;ctx.globalAlpha=.25;ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,40,0,7);ctx.stroke();ctx.globalAlpha=1;
  var r=ring();ctx.lineWidth=3;ctx.setLineDash([6,5]);ctx.beginPath();ctx.arc(r.x,r.y,34,0,7);ctx.stroke();ctx.setLineDash([]);
  var on=Math.hypot(S.px-r.x,S.py-r.y)<34,kx=Math.max(20,Math.min(340,S.px)),ky=Math.max(40,Math.min(400,S.py));
  ctx.strokeStyle=on?acc:"#8a9a9c";ctx.lineWidth=7;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(kx,ky);ctx.lineTo(kx+26,ky-26);ctx.stroke();ctx.lineCap="butt";
  ctx.fillStyle=on?acc:"#8a9a9c";ctx.beginPath();ctx.arc(kx+36,ky-36,20,0,7);ctx.fill();
  if(S.down&&S.pouring){ctx.strokeStyle="rgba(120,190,230,.9)";ctx.lineWidth=2;for(var k=0;k<2;k++){ctx.beginPath();ctx.arc(kx,ky,(((now/220)+k*.5)%1)*26,0,7);ctx.stroke()}ctx.fillStyle="rgba(120,190,230,.95)";ctx.beginPath();ctx.arc(kx,ky,5,0,7);ctx.fill()}
 }
 ctx.font="12px 'Noto Sans TC'";ctx.textAlign="left";
 var bars=[["濾杯水位",378,Math.max(0,S.W-RET)/CAP,"#4a9bbd"],["杯中咖啡",408,S.out/230,"#6b3f1d"]];
 bars.forEach(function(b){ctx.fillStyle=ink;ctx.fillText(b[0],40,b[1]-4);ctx.fillStyle=line;ctx.globalAlpha=.5;ctx.fillRect(40,b[1],280,10);ctx.globalAlpha=1;ctx.fillStyle=b[3];ctx.fillRect(40,b[1],280*Math.min(1,b[2]),10)});
 ctx.textAlign="center";ctx.font="700 16px 'Noto Sans TC'";
 if(p==="bloom"){ctx.fillStyle=ink;ctx.fillText("悶蒸中 "+Math.ceil(S.P.bloomT-S.bloomT)+" 秒",180,28)}
 if(S.W>=CAP+RET-.5&&(p==="main"||p==="pour1")){ctx.fillStyle=css("--bad");ctx.fillText("濾杯滿了,先等水流下去",180,28)}
 var t=S.t,m=Math.floor(t/60),s=Math.floor(t%60);
 $("hT").textContent=m+":"+(s<10?"0":"")+s;$("hP").textContent=Math.round(S.poured);$("hS").textContent=S.pourT>0?Math.round(S.onT/S.pourT*100)+"%":"--";
}
function draw(now){
 if(S.view==="top"){drawTop(now);return}
 ctx.clearRect(0,0,360,440);
 var ink=css("--ink"),line=css("--line"),acc=css("--accent"),cof="#6b3f1d";
 // cup
 var lvl=Math.min(1,S.out/230);
 ctx.fillStyle=line;ctx.globalAlpha=.35;ctx.fillRect(112,340,136,84);ctx.globalAlpha=1;
 ctx.fillStyle=cof;ctx.fillRect(112,424-84*lvl,136,84*lvl);
 ctx.strokeStyle=ink;ctx.lineWidth=3;
 ctx.beginPath();ctx.moveTo(112,340);ctx.lineTo(112,414);ctx.quadraticCurveTo(112,424,122,424);ctx.lineTo(238,424);ctx.quadraticCurveTo(248,424,248,414);ctx.lineTo(248,340);ctx.stroke();
